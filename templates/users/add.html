{% extends "base.html" %}

{% block title %}添加用户{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title mb-0">
                        <i class="fas fa-user-plus me-2"></i>添加用户
                    </h5>
                </div>
                
                <div class="card-body">
                    <form method="POST">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">用户名 <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" name="username" required 
                                           placeholder="输入登录用户名">
                                    <div class="form-text">用于系统登录，建议使用英文和数字组合</div>
                                </div>
                                
                                <div class="mb-3">
                                    <label class="form-label">密码 <span class="text-danger">*</span></label>
                                    <input type="password" class="form-control" name="password" required 
                                           placeholder="输入登录密码" minlength="6">
                                    <div class="form-text">密码长度至少6位</div>
                                </div>
                                
                                <div class="mb-3">
                                    <label class="form-label">用户角色 <span class="text-danger">*</span></label>
                                    <select name="role" class="form-select" required>
                                        <option value="user" selected>普通用户</option>
                                        <option value="admin">管理员</option>
                                    </select>
                                    <div class="form-text">
                                        <strong>普通用户</strong>：只能查看和管理自己的信息<br>
                                        <strong>管理员</strong>：可以管理所有数据和系统设置
                                    </div>
                                </div>
                            </div>
                            
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">关联员工</label>
                                    <select name="employee_id" class="form-select">
                                        <option value="">不关联员工</option>
                                        {% for employee in employees %}
                                        <option value="{{ employee.id }}">
                                            {{ employee.name }} ({{ employee.employee_no }}) - {{ employee.department.name if employee.department else '未分配部门' }}
                                        </option>
                                        {% endfor %}
                                    </select>
                                    <div class="form-text">关联员工后，用户可以查看和编辑对应的员工信息</div>
                                </div>
                                
                                <div class="alert alert-info">
                                    <h6><i class="fas fa-info-circle me-2"></i>权限说明</h6>
                                    <ul class="mb-0">
                                        <li><strong>管理员权限</strong>：完全访问所有功能模块</li>
                                        <li><strong>普通用户权限</strong>：只能查看基础信息和个人数据</li>
                                        <li><strong>关联员工</strong>：用户可以编辑关联员工的基本信息</li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-1"></i>创建用户
                            </button>
                            <a href="{{ url_for('users') }}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left me-1"></i>返回
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
